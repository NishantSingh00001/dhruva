name: gosum-tidy
on:
  workflow_dispatch: {}
  push:
    branches:
      - feat/driver-behavior-live-demo
    paths:
      - .github/workflows/gosum-tidy.yml
jobs:
  tidy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go mod tidy
      - uses: actions/upload-artifact@v4
        with:
          name: go-sum
          path: backend/go.sum
